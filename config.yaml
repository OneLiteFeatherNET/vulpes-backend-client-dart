# Description: Sort method arguments to place required parameters before optional parameters.
sortParamsByRequiredFlag: true

# Description: Sort model properties to place required parameters before optional parameters.
sortModelPropertiesByRequiredFlag: true

# Description: Whether to ensure parameter names are unique in an operation (rename parameters that are not).
ensureUniqueParams: true

# Description: boolean, toggles whether unicode identifiers are allowed in names or not, default is false
allowUnicodeIdentifiers: false

# Description: Add form or body parameters to the beginning of the parameter list.
prependFormOrBodyParameters: false

# Description: Set to false for generators with better support for discriminators. (Python, Java, Go, PowerShell, C# have this enabled by default).
# Available Values:
#    true
#         The mapping in the discriminator includes descendent schemas that allOf inherit from self and the discriminator mapping schemas in the OAS document.
#    false
#         The mapping in the discriminator includes any descendent schemas that allOf inherit from self, any oneOf schemas, any anyOf schemas, any x-discriminator-values, and the discriminator mapping schemas in the OAS document AND Codegen validates that oneOf and anyOf schemas contain the required discriminator and throws an error if the discriminator is missing.
legacyDiscriminatorBehavior: true

# Description: If false, the 'additionalProperties' implementation (set to true by default) is compliant with the OAS and JSON schema specifications. If true (default), keep the old (incorrect) behaviour that 'additionalProperties' is set to false by default.
# Available Values:
#    false
#         The 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
#    true
#         Keep the old (incorrect) behaviour that 'additionalProperties' is set to false by default.
disallowAdditionalPropertiesIfNotPresent: true

# Description: If the server adds new enum cases, that are unknown by an old spec/client, the client will fail to parse the network response.With this option enabled, each enum will have a new case, 'unknown_default_open_api', so that when the server sends an enum case that is not known by the client/spec, they can safely fallback to this case.
# Available Values:
#    false
#         No changes to the enum's are made, this is the default option.
#    true
#         With this option enabled, each enum will have a new case, 'unknown_default_open_api', so that when the enum case sent by the server is not known by the client/spec, can safely be decoded to this case.
enumUnknownDefaultCase: false

# Description: Library name in generated code
pubLibrary: openapi.api

# Description: Name in generated pubspec
pubName: openapi.api

# Description: Version in generated pubspec
pubVersion: 1.0.0

# Description: Description in generated pubspec
pubDescription: Vulpes Backend API Client

# Description: Author name in generated pubspec
pubAuthor: OneLiteFeatherNET

# Description: Email address of the author in generated pubspec
pubAuthorEmail: orga@onelitefeather.net

# Description: Homepage in generated pubspec
pubHomepage: https://github.com/OneLiteFeatherNET/vulpes-backend-client-dart

# Description: Repository in generated pubspec
pubRepository: https://github.com/OneLiteFeatherNET/vulpes-backend-client-dart

# Description: Publish_to in generated pubspec
pubPublishTo: https://github.com/OneLiteFeatherNET/vulpes-backend-client-dart

# Description: Allow the 'x-enum-values' extension for enums
useEnumExtension: false

# Description: source folder for generated code
sourceFolder: src

# Description: Specify serialization library
# Available Values:
#    built_value
#         [DEFAULT] built_value
#    json_serializable
#         [BETA] json_serializable
serializationLibrary: built_value

# Description: Specify equality check method. Takes effect only in case if serializationLibrary is json_serializable.
# Available Values:
#    default
#         [DEFAULT] Built in hash code generation method
#    equatable
#         Uses equatable library for equality checking
equalityCheckMethod: default

# Description: Specify Date library
# Available Values:
#    core
#         [DEFAULT] Dart core library (DateTime)
#    timemachine
#         Time Machine is date and time library for Flutter, Web, and Server with support for timezones, calendars, cultures, formatting and parsing.
dateLibrary: timemachine

# Description: Whether properties are marked as final when using Json Serializable for serialization
finalProperties: true

# Description: Skip CopyWith when using Json Serializable for serialization
skipCopyWith: false

