components:
  schemas:
    AttributeModelDTO:
      required:
      - defaultValue
      - maximumValue
      - uiName
      - variableName
      type: object
      properties:
        id:
          type: string
          description: ID of the attribute
          format: uuid
        uiName:
          minLength: 1
          type: string
          description: The name for the ui
        variableName:
          minLength: 1
          type: string
          description: The name which represents the variable after the generation
        defaultValue:
          minimum: 0
          type: number
          description: Default value of the attribute
          format: double
        maximumValue:
          minimum: 0
          exclusiveMinimum: true
          type: number
          description: Maximum value of the attribute
          format: double
    AttributeModelErrorDTO:
      type: object
      properties:
        errorMessage:
          type: string
          description: Error message
      description: Error message for Attribute Model
    FontModelDTO:
      required:
      - ascent
      - comment
      - height
      - mapper
      - provider
      - texturePath
      - uiName
      - variableName
      type: object
      properties:
        id:
          type: string
          description: ID of the mode
          format: uuid
        uiName:
          minLength: 1
          type: string
          description: Model Name for the ui
        variableName:
          minLength: 1
          type: string
          description: Name in the UI
        provider:
          minLength: 1
          type: string
          description: Which provider should be used
        mapper:
          minLength: 1
