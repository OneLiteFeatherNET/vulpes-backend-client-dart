openapi: 3.0.1
info:
  title: Vulpes Backend
  description: |-
    Vulpes Backend API handles the custom attributes, fonts, items and notifications API for Dungeon Project.
    It provides endpoints to manage custom attributes, fonts, items, and notifications.
    The API is designed to be used by the Vulpes Generator to generate dependencies for Minestom Server
  version: "1.0"
tags:
- name: Attribute
  description: Custom Minecraft Attribute API
- name: Font
  description: Custom Minecraft Font API
- name: Item
  description: Custom Minecraft Item API
- name: Notification
  description: Custom Minecraft Notification API
paths:
  /attribute:
    get:
      tags:
      - Attribute
      summary: Get all attributes
      description: Gets all attributes from the database.
      operationId: getAllAttributes
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The attributes were successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseAttributeModelDTO"
    post:
      tags:
      - Attribute
      summary: Add a new attribute
      description: Adds a new attribute to the database. The attribute is created
        with the given properties.
      operationId: addAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeModelDTO"
        required: true
      responses:
        "200":
          description: The attribute was successfully added to the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAttributeModelDTO"
        "500":
          description: The attribute could not be added to the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeModelErrorDTO"
  /attribute/delete:
    delete:
      tags:
      - Attribute
      summary: Delete all attributes
      description: Deletes all attributes from the database.
      operationId: deleteAllAttributes
      responses:
        "200":
          description: All attributes were successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAttributeModelDTO"
  /attribute/delete/{id}:
    delete:
      tags:
      - Attribute
      summary: Delete an attribute by ID
      description: Deletes the attribute with the given ID.
      operationId: deleteAttributeById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The attribute was successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAttributeModelDTO"
        "404":
          description: The attribute was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeModelErrorDTO"
  /attribute/update:
    post:
      tags:
      - Attribute
      summary: Update an attribute
      description: Returns the attribute with the given ID.
      operationId: updateAttribute
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeModelDTO"
        required: true
      responses:
        "200":
          description: The attribute was successfully found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseAttributeModelDTO"
        "404":
          description: The attribute was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeModelErrorDTO"
  /font:
    get:
      tags:
      - Font
      summary: Get all fonts
      description: Gets all fonts from the database.
      operationId: getAllFonts
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The fonts were successfully retrieved from the database.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseFontModelDTO"
    post:
      tags:
      - Font
      summary: Add a new font
      description: Adds a new font to the database. The font is created with the given
        properties.
      operationId: addFont
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FontModelDTO"
        required: true
      responses:
        "200":
          description: The font was successfully added to the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelDTO"
        "500":
          description: The font could not be added to the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelErrorDTO"
  /font/chars/{fontId}:
    delete:
      tags:
      - Font
      summary: Delete character of a font
      description: Delete the character of a font in the database.
      operationId: deleteChar
      parameters:
      - name: fontId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The characters of the font were successfully deleted in the
            database.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FontStringResponseDTO"
  /font/chars/{fontId}/{charId}:
    delete:
      tags:
      - Font
      summary: Delete character of a font
      description: Delete the character of a font in the database.
      operationId: deleteChar_1
      parameters:
      - name: fontId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: charId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The characters of the font were successfully updated in the
            database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontStringDTO"
        "404":
          description: The character was not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontStringErrorDTO"
  /font/chars/{id}:
    get:
      tags:
      - Font
      summary: Get characters by font ID
      description: Gets the characters of a font by its ID from the database.
      operationId: getCharsById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The characters of the font were successfully retrieved from
            the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FontStringResponseDTO"
        "404":
          description: The font was not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelErrorDTO"
    put:
      tags:
      - Font
      summary: Create character of a font
      description: Create the character of a font in the database.
      operationId: createChar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FontStringDTO"
        required: true
      responses:
        "200":
          description: The characters of the font were successfully updated in the
            database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FontStringResponseDTO"
    post:
      tags:
      - Font
      summary: Update character of a font
      description: Updates the character of a font in the database.
      operationId: updateChar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FontStringDTO"
        required: true
      responses:
        "200":
          description: The characters of the font were successfully updated in the
            database.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FontStringResponseDTO"
  /font/delete:
    delete:
      tags:
      - Font
      summary: Delete all fonts
      description: Deletes all fonts from the database.
      operationId: deleteAllFonts
      responses:
        "200":
          description: All fonts were successfully deleted from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelDTO"
  /font/delete/{id}:
    delete:
      tags:
      - Font
      summary: Remove a font by ID
      description: Removes a font by ID from the database.
      operationId: deleteFont
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The font was successfully removed from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelDTO"
        "404":
          description: The font was not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelErrorDTO"
  /font/update:
    post:
      tags:
      - Font
      summary: Update a font
      description: Updates a font in the database.
      operationId: updateFont
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FontModelDTO"
        required: true
      responses:
        "200":
          description: The font was successfully updated in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelDTO"
        "404":
          description: The font was not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelErrorDTO"
  /font/{id}:
    get:
      tags:
      - Font
      summary: Get a font by ID
      description: Gets a font by ID from the database.
      operationId: getFontById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The font was successfully retrieved from the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelDTO"
        "404":
          description: The font was not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseFontModelErrorDTO"
  /item:
    get:
      tags:
      - Item
      summary: Get all items
      description: "Retrieves a pageable list of all items. Supports standard Micronaut\
        \ pagination (page, size, sort)."
      operationId: getAllItems
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Items successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemModelDTO"
    post:
      tags:
      - Item
      summary: Create a new item
      description: Creates a new item with the provided properties and stores it in
        the database.
      operationId: addItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemModelDTO"
        required: true
      responses:
        "200":
          description: Item successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemModelDTO"
        "500":
          description: Item could not be created due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemModelErrorDTO"
  /item/delete/{itemId}:
    delete:
      tags:
      - Item
      summary: Remove an item by ID
      description: Deletes an item from the database by its unique ID (itemId).
      operationId: removeItemById
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Item successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemModelDTO"
        "404":
          description: Item with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemModelErrorDTO"
  /item/deleteAll:
    delete:
      tags:
      - Item
      summary: Delete all items
      description: Deletes all items from the database.
      operationId: deleteAll
      responses:
        "200":
          description: All items were successfully deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemModelDTO"
  /item/enchantment/{itemId}:
    put:
      tags:
      - Item
      summary: Create an enchantment for an item
      description: Creates a new enchantment entry for the item identified by itemId.
      operationId: createEnchantment
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemEnchantmentDTO"
        required: true
      responses:
        "200":
          description: Enchantment successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentErrorDTO"
    post:
      tags:
      - Item
      summary: Update an enchantment of an item
      description: Updates a specific enchantment of the item identified by itemId.
      operationId: updateEnchantment
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemEnchantmentDTO"
        required: true
      responses:
        "200":
          description: Enchantment successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentErrorDTO"
    delete:
      tags:
      - Item
      summary: Delete all enchantments of an item
      description: Deletes all enchantments of the item identified by itemId.
      operationId: deleteEnchantments
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Enchantments successfully deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemEnchantmentDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentErrorDTO"
  /item/enchantment/{itemId}/{enchantmentId}:
    delete:
      tags:
      - Item
      summary: Delete an enchantment of an item
      description: Deletes a specific enchantment (enchantmentId) of the item identified
        by itemId.
      operationId: deleteEnchantment
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: enchantmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Enchantment successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemEnchantmentErrorDTO"
  /item/enchantments/{itemId}:
    get:
      tags:
      - Item
      summary: Get enchantments of an item
      description: Retrieves a pageable list of enchantments for the item identified
        by itemId.
      operationId: getEnchantments
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Enchantments successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemEnchantmentResponseDTO"
  /item/flag/{itemId}:
    put:
      tags:
      - Item
      summary: Create flag of an item
      description: Creates a new flag entry for the item identified by itemId.
      operationId: createFlag
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemFlagDTO"
        required: true
      responses:
        "200":
          description: Flag successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagErrorDTO"
    post:
      tags:
      - Item
      summary: Update flag of an item
      description: Updates a specific flag of the item identified by itemId.
      operationId: updateFlag
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemFlagDTO"
        required: true
      responses:
        "200":
          description: Flag successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagErrorDTO"
    delete:
      tags:
      - Item
      summary: Delete all flags of an item
      description: Deletes all flags of the item identified by itemId.
      operationId: deleteFlags
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: All flags were successfully deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemFlagDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagErrorDTO"
  /item/flag/{itemId}/{flagId}:
    delete:
      tags:
      - Item
      summary: Delete flag of an item
      description: Deletes a specific flag (flagId) of the item identified by itemId.
      operationId: deleteFlag
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: flagId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Flag successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemFlagErrorDTO"
  /item/flags/{itemId}:
    get:
      tags:
      - Item
      summary: Get all flags of an item
      description: Retrieves a pageable list of flags for the item identified by itemId.
      operationId: getFlags
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Flags successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemFlagDTO"
  /item/lore/{itemId}:
    get:
      tags:
      - Item
      summary: Get all lore of an item
      description: Retrieves a pageable list of lore entries for the item identified
        by itemId.
      operationId: getLore
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Lore successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemLoreResponseDTO"
    put:
      tags:
      - Item
      summary: Create lore of an item
      description: Creates a new lore entry for the item identified by itemId.
      operationId: createLore
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemLoreDTO"
        required: true
      responses:
        "200":
          description: Lore successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreErrorDTO"
    post:
      tags:
      - Item
      summary: Update lore of an item
      description: Updates a specific lore entry of the item identified by itemId.
      operationId: updateLore
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemLoreDTO"
        required: true
      responses:
        "200":
          description: Lore successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreErrorDTO"
    delete:
      tags:
      - Item
      summary: Delete all lore of an item
      description: Deletes all lore entries of the item identified by itemId.
      operationId: deleteAllLore
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: All lore entries were successfully deleted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResponseItemLoreDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreErrorDTO"
  /item/lore/{itemId}/{loreId}:
    delete:
      tags:
      - Item
      summary: Delete lore of an item
      description: Deletes a specific lore entry (loreId) of the item identified by
        itemId.
      operationId: deleteLore
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: loreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Lore successfully deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreDTO"
        "404":
          description: Item for the given ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemLoreErrorDTO"
  /item/update:
    post:
      tags:
      - Item
      summary: Update an item
      description: Updates an existing item in the database.
      operationId: updateItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemModelDTO"
        required: true
      responses:
        "200":
          description: Item successfully updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseItemModelDTO"
        "404":
          description: Item was not found and could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemModelErrorDTO"
  /item/{itemId}:
    get:
      tags:
      - Item
      summary: Get an item by ID
